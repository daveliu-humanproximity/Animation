<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeesEye — Network Smarter</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font-family:Inter,system-ui,Arial,sans-serif}.wrap{width:100%;max-width:430px;margin:auto;padding:12px 8px 16px}.headline{height:136px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px}.headlineText{font-size:clamp(18px,5vw,21px);font-weight:600;line-height:1.38;letter-spacing:-.3px;transition:opacity .3s}.room{height:320px;position:relative;overflow:hidden;border:1px solid #303030;border-radius:11px;background:radial-gradient(ellipse at center,#211f1b,#101010 80%)}.person{position:absolute;width:46px;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-50%)}.avatar{width:28px;height:28px;border-radius:50%;background:#303030;border:1px solid #858585;display:grid;place-items:center}.avatar svg{width:19px;height:19px;fill:none;stroke:#ddd;stroke-width:1.7}.role{font-size:11px;font-weight:500;line-height:1.15;color:#fff;background:#292929;border:1px solid #575757;border-radius:4px;padding:3px 4px;white-space:nowrap}.person.match .avatar{border-color:#ffd52b;background:#50420b}.person.match .avatar svg{stroke:#ffd52b}.person.match .role{background:#ffd52b;color:#111;border-color:#ffd52b;font-weight:700}.number{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#555;color:white;font-size:9px;font-weight:700;display:grid;place-items:center;opacity:0;transition:opacity .45s}.ranked .number{opacity:1}.controls{display:flex;gap:12px;margin-top:16px}button{border-radius:8px;padding:12px;font-weight:650;cursor:pointer}#play{flex:1;background:#ffd52b;color:#111;border:0}#replay{background:transparent;color:#fff;border:1px solid #555;padding:12px 20px}@media(max-width:370px){.role{font-size:10px;padding:3px 2px}.avatar{width:26px;height:26px}}@media(prefers-reduced-motion:reduce){.headlineText,.number{transition:none}}
</style></head><body><main class="wrap"><div class="headline"><div id="headline" class="headlineText" aria-live="polite">In a room full of strangers, meeting the people you want is often left to chance.</div></div><div class="room"><div id="people" style="position:absolute;inset:0"></div></div><div class="controls"><button id="play">Pause</button><button id="replay">Replay</button></div></main><script>
(function(){const roles=['Investor','Recruiter','Engineer','Banker','Founder','Attorney','Student','Recruiter','Designer','Doctor','Consultant','Analyst','Recruiter','Marketing','Executive','Recruiter','Professor','Finance','Recruiter','Entrepreneur','Manager','Advisor','Developer','Recruiter','Accountant','Director','Researcher','Recruiter'];const initial=[[10,12],[26,10],[44,17],[65,9],[87,14],[17,27],[35,30],[57,27],[80,30],[10,43],[27,46],[46,42],[66,45],[89,43],[16,59],[35,60],[55,59],[76,62],[91,73],[12,77],[29,78],[48,77],[67,78],[85,88],[10,91],[39,91],[61,92],[82,52]];const matches=[1,7,12,15,18,23,27],order=[...matches,...roles.map((_,i)=>i).filter(i=>!matches.includes(i))];const host=document.getElementById('people'),headline=document.getElementById('headline'),play=document.getElementById('play');const svg='<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2c0-4 3-6 8-6s8 2 8 6v2"/></svg>';const people=roles.map(role=>{const el=document.createElement('div');el.className='person';el.innerHTML='<div class="number"></div><div class="avatar">'+svg+'</div><div class="role">'+role+'</div>';host.appendChild(el);return el});const lines=['In a room full of strangers, meeting the people you want is often left to chance.','You have to work the room.','What if the room could work for you?','What if the room could line up around who you want to meet?','Now you can. Network smarter.'];const durations=[6500,4000,4500,6500,6500];let phase=0,running=true,timer,raf,revision=0,last=0,rankTimeout,coords=[],remaining=durations[0],startedAt=0;function resetCoords(){coords=initial.map(([x,y],i)=>({x,y,vx:((i*13%17)/17-.5)*1.5,vy:((i*7%19)/19-.5)*1.28,tx:x,ty:y}))}function paint(){people.forEach((el,i)=>{el.style.left=coords[i].x+'%';el.style.top=coords[i].y+'%'})}function tick(now){if(!running)return;if(!last)last=now;const dt=Math.min((now-last)/1000,.06);last=now;if(phase<3){coords.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<9||p.x>91)p.vx*=-1;if(p.y<10||p.y>90)p.vy*=-1;p.x=Math.max(9,Math.min(91,p.x));p.y=Math.max(10,Math.min(90,p.y))})}else if(phase===3){coords.forEach(p=>{p.x+=(p.tx-p.x)*Math.min(1,dt*1.3);p.y+=(p.ty-p.y)*Math.min(1,dt*1.3)})}paint();raf=requestAnimationFrame(tick)}function show(n){phase=n;clearTimeout(rankTimeout);const rev=++revision;headline.style.opacity='0';setTimeout(()=>{if(rev!==revision)return;headline.textContent=lines[n];headline.style.opacity='1'},320);if(n===0){resetCoords();people.forEach(el=>el.classList.remove('ranked','match'))}if(n===3){people.forEach((el,i)=>{const r=order.indexOf(i),p=coords[i];p.tx=9+(r%7)*13.65;p.ty=15+Math.floor(r/7)*24;const badge=el.querySelector('.number');badge.textContent=r+1;badge.style.background=r<7?'#ffd52b':'#555';badge.style.color=r<7?'#111':'#fff'});rankTimeout=setTimeout(()=>{if(phase!==3)return;people.forEach((el,i)=>{const r=order.indexOf(i);el.classList.add('ranked');el.classList.toggle('match',r<7)});headline.textContent='What if the room could line up around who you want to meet? Ranked.'},3700)}if(n===4){coords.forEach(p=>{p.x=p.tx;p.y=p.ty});paint()}}function schedule(delay=durations[phase]){clearTimeout(timer);if(!running)return;remaining=delay;startedAt=performance.now();timer=setTimeout(()=>{show((phase+1)%5);schedule()},delay)}play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play';if(running){last=0;raf=requestAnimationFrame(tick);schedule(remaining)}else{cancelAnimationFrame(raf);clearTimeout(timer);remaining=Math.max(0,remaining-(performance.now()-startedAt))}};document.getElementById('replay').onclick=()=>{running=true;play.textContent='Pause';cancelAnimationFrame(raf);show(0);last=0;raf=requestAnimationFrame(tick);schedule()};resetCoords();paint();show(0);raf=requestAnimationFrame(tick);schedule()})();
</script></body></html>
