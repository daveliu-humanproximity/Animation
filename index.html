<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeesEye — Network Smarter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}.stage{max-width:430px;margin:0 auto;padding:24px 7px 8px}.copy{height:54px;display:flex;align-items:flex-start;justify-content:center;padding:0 3px}.words{width:100%;text-align:center;font-size:clamp(18px,5vw,21px);font-weight:600;line-height:1.24;letter-spacing:-.35px}.word{opacity:0;filter:blur(1.5px);transition:opacity .5s,filter .5s}.word.on{opacity:1;filter:blur(0)}.word.yellow{color:#ffd52b}.room{height:350px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 48% 45%,#27241e,#151515 78%,#0c0c0c)}.person{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:46px;will-change:left,top}.avatar{width:26px;height:26px;border:1px solid #777;background:#303030;border-radius:50%;display:grid;place-items:center;transition:background .65s,border-color .65s}.avatar svg{width:17px;height:17px;stroke:#eee;stroke-width:1.7;fill:none}.role{font-size:9px;white-space:nowrap;padding:3px;border-radius:4px;background:#282828;border:1px solid #555;opacity:0;transform:translateY(-3px);transition:opacity .65s,transform .65s,background .65s,color .65s}.person.revealed .role{opacity:1;transform:translateY(0)}.person.match .avatar{border-color:#ffd52b;background:#514309}.person.match .avatar svg{stroke:#ffd52b}.person.match .role{background:#ffd52b;border-color:#ffd52b;color:#111;font-weight:bold}.rank{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:bold;border-radius:50%;width:16px;height:16px;display:grid;place-items:center;background:#555;opacity:0;transition:opacity .65s}.person.revealed .rank{opacity:1}@media(max-width:360px){.copy{height:62px}.room{height:335px}}
</style></head><body><main class="stage"><div class="copy"><div class="words" id="words"></div></div><div class="room"><div id="people" style="position:absolute;inset:0"></div></div></main>
<script>
(function(){
const roles=['Investor','Recruiter','Engineer','Banker','Founder','Attorney','Student','Recruiter','Designer','Doctor','Consultant','Analyst','Recruiter','Marketing','Executive','Recruiter','Professor','Finance','Recruiter','Entrepreneur','Manager','Advisor','Developer','Recruiter','Accountant','Director','Researcher','Recruiter'];
const groups=[{c:[18,16],ids:[0,2,5],rx:7,ry:7},{c:[70,15],ids:[1,7],rx:6,ry:5},{c:[42,31],ids:[11,15,3],rx:7,ry:7},{c:[82,38],ids:[4,8,12],rx:7,ry:7},{c:[17,43],ids:[6,9],rx:6,ry:5},{c:[39,59],ids:[10,13,16],rx:7,ry:7},{c:[75,66],ids:[14,17,18,19],rx:8,ry:8},{c:[19,82],ids:[20,21],rx:6,ry:5},{c:[53,88],ids:[22,23,24],rx:7,ry:6}];
const walkers=[25,26,27],top=[1,7,12,15,18,23,27],ordered=[...top,...roles.map((_,i)=>i).filter(i=>!top.includes(i))];
const host=document.getElementById('people'),out=document.getElementById('words');
const svg='<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2c0-4 3-6 8-6s8 2 8 6v2"/></svg>';
const nodes=roles.map(role=>{const el=document.createElement('div');el.className='person';el.innerHTML='<div class="rank"></div><div class="avatar">'+svg+'</div><div class="role">'+role+'</div>';host.appendChild(el);return el});
const lines=['At networking events, you often make meaningful connections by chance.','You have to work the room, not knowing who to approach.','What if the room could work for you?','What if the room could line up around who you want to meet?','Now you can. Network smarter.'];
const durations=[5650,4300,4050,7300,5250];let phase=0,rev=0,wordTimeout,phaseTimeout,rankTimeout,last=0,elapsed=0,coords=[],freezeUntil=0;
function reset(){coords=roles.map((_,i)=>({x:50,y:50,baseX:50,baseY:50,tx:50,ty:50,seed:i*1.73,walk:walkers.includes(i),home:0}));groups.forEach((g,gi)=>g.ids.forEach((id,k)=>{const a=2*Math.PI*k/g.ids.length+gi*.31+k*.1,p=coords[id];p.baseX=g.c[0]+Math.cos(a)*g.rx;p.baseY=g.c[1]+Math.sin(a)*g.ry;p.x=p.baseX;p.y=p.baseY}));[[54,12],[10,60],[90,85]].forEach((pos,k)=>{const p=coords[walkers[k]];p.x=pos[0];p.y=pos[1];p.baseX=p.x;p.baseY=p.y;p.home=k})}
function reveal(message,r){clearTimeout(wordTimeout);out.replaceChildren();const spans=message.split(/\s+/).map((w,i,a)=>{const s=document.createElement('span');s.className='word';s.textContent=w+(i<a.length-1?' ':'');out.appendChild(s);return s});let i=0;function next(){if(r!==rev||i>=spans.length)return;spans[i++].classList.add('on');wordTimeout=setTimeout(next,Math.min(140,Math.max(65,900/spans.length)))}requestAnimationFrame(next)}
function render(){nodes.forEach((el,i)=>{el.style.left=coords[i].x+'%';el.style.top=coords[i].y+'%'})}
function animate(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.06);last=t;elapsed+=dt;if(phase<3){coords.forEach(p=>{let x,y;if(p.walk){const k=p.home,a=elapsed*.105+k*1.6;if(k===0){x=54+9*Math.sin(a);y=15+23*Math.sin(a*.8)}else if(k===1){x=12+11*Math.sin(a);y=57+20*Math.sin(a*.9)}else{x=82+10*Math.sin(a);y=72+17*Math.sin(a*.7)}}else{x=p.baseX+Math.sin(elapsed*.35+p.seed)*.48;y=p.baseY+Math.cos(elapsed*.31+p.seed)*.4}p.x+=(x-p.x)*Math.min(1,dt*(p.walk?.42:1.3));p.y+=(y-p.y)*Math.min(1,dt*(p.walk?.42:1.3))})}else if(phase===3&&elapsed>=freezeUntil){coords.forEach(p=>{p.x+=(p.tx-p.x)*Math.min(1,dt*1.25);p.y+=(p.ty-p.y)*Math.min(1,dt*1.25)})}render();requestAnimationFrame(animate)}
function show(n){phase=n;clearTimeout(rankTimeout);const r=++rev;reveal(lines[n],r);if(n===0){elapsed=0;reset();nodes.forEach(el=>el.classList.remove('match','revealed'))}if(n===3){freezeUntil=elapsed+.65;nodes.forEach((el,i)=>{const rank=ordered.indexOf(i),p=coords[i];p.tx=9+(rank%7)*13.65;p.ty=15+Math.floor(rank/7)*24;const b=el.querySelector('.rank');b.textContent=rank+1;b.style.background=rank<7?'#ffd52b':'#555';b.style.color=rank<7?'#111':'#fff'});rankTimeout=setTimeout(()=>{if(r!==rev)return;nodes.forEach((el,i)=>{el.classList.add('revealed');el.classList.toggle('match',ordered.indexOf(i)<7)});const s=document.createElement('span');s.className='word yellow';s.textContent=' Ranked.';out.appendChild(s);requestAnimationFrame(()=>s.classList.add('on'))},4900)}}
function schedule(){clearTimeout(phaseTimeout);phaseTimeout=setTimeout(()=>{show((phase+1)%5);schedule()},durations[phase])}reset();render();show(0);requestAnimationFrame(animate);schedule();
})();
</script></body></html>
